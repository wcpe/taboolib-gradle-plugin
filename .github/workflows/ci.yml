name: 构建与缓存回归

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

permissions:
  contents: read

jobs:
  check:
    name: Gradle ${{ matrix.gradle-version }} 构建与缓存回归
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gradle-version: ['9.4.0', '9.5.0']
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle-version }}

      - name: 构建、功能回归与插件校验
        # build 依赖 check，check 已包含真实消费工程 functionalTest。
        run: gradle build validatePlugins --no-daemon --no-configuration-cache --console=plain --stacktrace --max-workers=2

      - name: 保留验证报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taboolib-check-gradle-${{ matrix.gradle-version }}
          path: |
            build/reports/
            build/test-results/
            .tmp/cache-functional-test/**/run-*.log
          include-hidden-files: true
          if-no-files-found: ignore
